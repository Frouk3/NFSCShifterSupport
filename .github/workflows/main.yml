name: MSVC SLNX Build Workflow

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DXSDK_DIR: ${{ github.workspace }}\dxsdk\

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}\dxsdk
        key: dxsdk-june2010-v1

    # Step 3: Download and extract DirectX June 2010 if cache missed
    - name: Download & Extract DirectX SDK
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        # 1. Disable the progress bar to instantly boost download speeds
        $ProgressPreference = 'SilentlyContinue'
        
        # 2. Use curl.exe (much faster than Invoke-WebRequest)
        curl.exe -L -o "dxsdk.exe" "https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe"
        
        # 3. Extract to temporary folder
        & "C:\Program Files\7-Zip\7z.exe" x dxsdk.exe DXSDK/Include -o_temp
        & "C:\Program Files\7-Zip\7z.exe" x dxsdk.exe DXSDK/Lib/x86 -o_temp
        
        # 4. Organize target directory
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\dxsdk"
        Move-Item -Path "_temp\DXSDK\Include" -Destination "${{ github.workspace }}\dxsdk\Include"
        Move-Item -Path "_temp\DXSDK\Lib" -Destination "${{ github.workspace }}\dxsdk\Lib"
        
        # 5. Clean up files
        Remove-Item -Path "dxsdk.exe" -Force
        Remove-Item -Path "_temp" -Recurse -Force

    - name: Set DXSDK_DIR Environment Variable
      shell: bash
      run: |
        echo "DXSDK_DIR=${{ github.workspace }}\\dxsdk\\" >> $GITHUB_ENV

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build SLNX Solution
      run: |
        msbuild NFSCShifterSupport.slnx /p:Configuration=Release /p:Platform=x86
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          **/Release/*.asi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
